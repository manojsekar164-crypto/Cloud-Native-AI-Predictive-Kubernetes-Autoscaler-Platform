apiVersion: v1
kind: Service

metadata:
  name: backend-service
  namespace: ai-autoscaler

  labels:
    app: backend

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "4000"

spec:
  type: ClusterIP

  selector:
    app: backend

  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000