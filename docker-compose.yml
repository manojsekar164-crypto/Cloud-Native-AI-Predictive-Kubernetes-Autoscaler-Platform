services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: autoscaler-mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - autoscaler-network

  # Backend API (Node.js)
  backend:
    build: ./backend
    container_name: autoscaler-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongodb:27017/autoscaler
      - ML_SERVICE_URL=http://ml-service:5000
    depends_on:
      - mongodb
      - ml-service
    networks:
      - autoscaler-network
    restart: unless-stopped

  # ML Service (Python Flask)
  ml-service:
    build: ./ml-service
    container_name: autoscaler-ml
    ports:
      - "5000:5000"
    networks:
      - autoscaler-network
    restart: unless-stopped

  # Frontend (React) - Development
  frontend:
    build: ./frontend
    container_name: autoscaler-frontend
    ports:
      - "3005:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:4000/api
    depends_on:
      - backend
    networks:
      - autoscaler-network
    stdin_open: true
    tty: true

  # Prometheus - scrapes backend metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: autoscaler-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - autoscaler-network
    restart: unless-stopped

  # Grafana - visualizes prometheus metrics
  grafana:
    image: grafana/grafana:latest
    container_name: autoscaler-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - autoscaler-network
    restart: unless-stopped

networks:
  autoscaler-network:
    driver: bridge

volumes:
  mongodb_data:
  grafana_data:
